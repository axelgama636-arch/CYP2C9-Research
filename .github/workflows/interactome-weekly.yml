name: CYP2C9 interactome update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write

jobs:
  string-interactome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Retrieve CYP2C9 network from STRING
        run: python scripts/02_interactome_string.py --nodes 50 --score 700
      - name: Commit refreshed network data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/interactome/
          git diff --cached --quiet || git commit -m "Update CYP2C9 STRING interactome"
          git push
