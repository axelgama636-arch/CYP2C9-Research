name: CYP2C9 population allele frequencies

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/06_population_frequencies.py"
      - ".github/workflows/population-frequencies.yml"

permissions:
  contents: write

jobs:
  population-frequencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Retrieve population frequency observations
        run: python scripts/06_population_frequencies.py
      - name: Commit raw responses and processed tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ensembl/ data/processed/population_frequencies/
          git diff --cached --quiet || git commit -m "Add CYP2C9 population allele frequency data"
          git push
