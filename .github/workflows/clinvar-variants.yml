name: CYP2C9 ClinVar variant catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: write

jobs:
  clinvar-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Retrieve CYP2C9 ClinVar variants
        run: python scripts/05_clinvar_variants.py
      - name: Commit variant catalogue and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/clinvar/ data/processed/variants/
          git diff --cached --quiet || git commit -m "Update CYP2C9 ClinVar variant catalogue"
          git push
