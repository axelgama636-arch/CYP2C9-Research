name: CYP2C9 expression heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: write

jobs:
  build-expression-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install requests pandas numpy matplotlib
      - name: Retrieve current STRING network
        run: python scripts/02_interactome_string.py --nodes 50 --score 700
      - name: Build HPA tissue expression heatmap
        run: python scripts/03_expression_heatmap.py
      - name: Commit data, matrices and figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/interactome/ data/processed/expression/
          git diff --cached --quiet || git commit -m "Update CYP2C9 tissue expression heatmap"
          git push
