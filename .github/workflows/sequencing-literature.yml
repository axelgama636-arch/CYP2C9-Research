name: CYP2C9 sequencing literature

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: write

jobs:
  literature-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Search Europe PMC and curate records
        run: python scripts/04_sequencing_literature.py
      - name: Commit literature corpus and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/europe_pmc/ data/processed/literature/
          git diff --cached --quiet || git commit -m "Update CYP2C9 sequencing literature corpus"
          git push
